services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      # ホスト側に node_modules を作らないため、ボリュームで隠す
      - node_modules:/app/node_modules
    ports:
      - "5173:5173" # vite dev
      - "4173:4173" # vite preview
    environment:
      # 変更検知が効かない環境向けのフォールバック
      - CHOKIDAR_USEPOLLING=1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
